name: Build TWRP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    # 1. Используем официальное действие GitHub для автоматического расширения памяти до 12 ГБ
    - name: Увеличение оперативной памяти (Swap)
      uses: thejerrybao/setup-swap-space@v1
      with:
        swap-size-gb: 12

    - name: Подготовка сервера
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential tar zip curl git python3 wget

    - name: Сборка TWRP
      run: |
        git config --global user.email "bot@twrp.me"
        git config --global user.name "TWRP-Bot"
        export REPO_NOT_TERMINAL=1
        
        mkdir twrp && cd twrp
        
        # Скачиваем repo через wget
        wget -q https://githubusercontent.com -O ./repo
        chmod 777 ./repo
        chmod +x ./repo
        
        # Запускаем init и sync в 1 поток для жесткой экономии ресурсов
        ./repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --no-clone-bundle --depth=1
        ./repo sync -j1 --force-sync --no-clone-bundle --no-tags -q
        
        # Скачиваем дерево устройства для Samsung Tab S7 FE 5G
        git clone -q https://github.com -b android-12.1 device/samsung/gts7xllite
        
        . build/envsetup.sh
        lunch twrp_gts7xllite-eng
        
        # Запускаем компиляцию строго в 1 поток (-j1), чтобы сервер гарантированно не упал по памяти
        mka recoveryimage -j1
