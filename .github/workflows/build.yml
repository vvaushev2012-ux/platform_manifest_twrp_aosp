name: Build TWRP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Подготовка сервера и памяти
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential tar zip curl git python3 wget
        
        # РЕШЕНИЕ ОШИБКИ 4: Создаем дополнительный файл подкачки на 8 ГБ
        sudo swapoff -a
        sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
    - name: Сборка TWRP
      run: |
        git config --global user.email "bot@twrp.me"
        git config --global user.name "TWRP-Bot"
        export REPO_NOT_TERMINAL=1
        
        mkdir twrp && cd twrp
        
        # Скачиваем repo через wget
        wget -q https://githubusercontent.com -O ./repo
        chmod 777 ./repo
        chmod +x ./repo
        
        # Запускаем init и sync в тихом режиме
        ./repo init -u https://github.com -b twrp-12.1 --no-clone-bundle --depth=1
        ./repo sync -j2 --force-sync --no-clone-bundle --no-tags -q
        
        # Скачиваем дерево устройства для Samsung Tab S7 FE 5G
        git clone -q https://github.com -b android-12.1 device/samsung/gts7xllite
        
        . build/envsetup.sh
        lunch twrp_gts7xllite-eng
        
        # РЕШЕНИЕ ОШИБКИ 4: Ограничиваем сборку строго в 2 потока (-j2), чтобы не взорвать оперативную память
        mka recoveryimage -j2
