name: Build TWRP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    # 1. Официальное действие из маркетплейса GitHub. Создает 12 ГБ Swap БЕЗ опасных rm -rf и скрытых ошибок
    - name: Настройка безопасной виртуальной памяти
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 12

    - name: Подготовка системы
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential tar zip curl git python3 wget

    - name: Сборка TWRP
      run: |
        git config --global user.email "bot@twrp.me"
        git config --global user.name "TWRP-Bot"
        export REPO_NOT_TERMINAL=1
        
        mkdir twrp && cd twrp
        
        # Скачиваем рабочий скрипт repo через wget
        wget -q https://githubusercontent.com -O ./repo
        chmod +x ./repo
        
        # Запускаем инициализацию и тихое скачивание
        ./repo init -u https://github.com -b twrp-12.1 --no-clone-bundle --depth=1
        ./repo sync -j2 --force-sync --no-clone-bundle --no-tags -q
        
        # Скачиваем дерево устройства для вашего Samsung Tab S7 FE 5G
        git clone -q https://github.com -b android-12.1 device/samsung/gts7xllite
        
        # Запуск компиляции
        . build/envsetup.sh
        lunch twrp_gts7xllite-eng
        mka recoveryimage -j1
